<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 无权限 - Ads Manager</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .error-page {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; background: var(--bg-primary); text-align: center; padding: 40px;
        }
        .error-page h1 { font-size: 72px; color: var(--warning); margin-bottom: 12px; }
        .error-page p { color: var(--text-muted); margin-bottom: 24px; font-size: 16px; }

<body>
    <div class="error-page">
        <h1>403</h1>
        <p>🚫 您没有访问此页面的权限，请联系管理员。</p>
        <a href="/dashboard" class="btn btn-primary">返回首页</a>

</html>
