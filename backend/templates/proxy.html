{% extends "base.html" %}
{% block title %}代理管理 - Ads Manager{% endblock %}

{% block content %}
<div class="page-header">
    <h1>🔌 代理管理</h1>
    <p class="text-muted">管理代理服务器配置，创建环境时从此处选取</p>
</div>

<!-- 操作按钮 -->
<div class="action-bar">
    <button class="btn btn-primary" onclick="openAddModal()">➕ 添加代理</button>
    <button class="btn btn-secondary" onclick="loadProxies()">🔄 刷新列表</button>
</div>

<!-- 代理列表 -->
<div class="card">
    <h3>代理列表 <span id="proxy-count" class="text-muted" style="font-weight:normal;font-size:14px;"></span></h3>
    <div style="overflow-x:auto;">
        <table class="data-table" id="proxy-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>名称</th>
                    <th>代理软件</th>
                    <th>代理类型</th>
                    <th>主机:端口</th>
                    <th>用户名</th>
                    <th>状态</th>
                    <th>备注</th>
                    <th>操作人</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="11" class="text-center text-muted">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ===== 添加/编辑代理弹窗 ===== -->
<div class="modal" id="proxy-modal">
    <div class="modal-content" style="max-width: 600px;">
        <span class="modal-close" onclick="closeFormModal()">&times;</span>
        <h2 id="proxy-modal-title">添加代理</h2>
        <form id="proxy-form" onsubmit="submitProxyForm(event)">
            <input type="hidden" name="id" value="">
            <div class="form-group">
                <label>名称</label>
                <input type="text" name="name" placeholder="给代理起个名字便于识别（如：美国SOCKS5-01）">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group">
                    <label>代理软件</label>
                    <select name="proxy_soft">
                        <option value="other">other（其他）</option>
                        <option value="brightdata">brightdata</option>
                        <option value="oxylabsauto">oxylabsauto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>代理类型</label>
                    <select name="proxy_type">
                        <option value="socks5">socks5</option>
                        <option value="http">http</option>
                        <option value="https">https</option>
                    </select>
                </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group">
                    <label>主机地址 <span style="color:var(--error)">*</span></label>
                    <input type="text" name="proxy_host" placeholder="如 1.2.3.4" required>
                </div>
                <div class="form-group">
                    <label>端口 <span style="color:var(--error)">*</span></label>
                    <input type="text" name="proxy_port" placeholder="如 1080" required>
                </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group">
                    <label>用户名（可选）</label>
                    <input type="text" name="proxy_user" placeholder="代理用户名">
                </div>
                <div class="form-group">
                    <label>密码（可选）</label>
                    <input type="password" name="proxy_password" placeholder="代理密码">
                </div>
            </div>
            <div class="form-group">
                <label>备注</label>
                <input type="text" name="remark" placeholder="说明这个代理的用途">
            </div>
            <div class="form-group">
                <label>操作人</label>
                <input type="text" name="operator" placeholder="谁操作的（如 admin / 张三）">
            </div>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
                <button type="button" class="btn btn-secondary" onclick="closeFormModal()">取消</button>
                <button type="submit" class="btn btn-primary">💾 保存</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
// ===== 模态框 =====
function openAddModal() {
    document.getElementById('proxy-modal-title').textContent = '添加代理';
    const form = document.getElementById('proxy-form');
    form.reset();
    form.id.value = '';
    document.getElementById('proxy-modal').style.display = 'flex';
}

function openEditModal(proxy) {
    document.getElementById('proxy-modal-title').textContent = '编辑代理';
    const form = document.getElementById('proxy-form');
    form.id.value = proxy.id;
    form.name.value = proxy.name || '';
    form.proxy_soft.value = proxy.proxy_soft || 'other';
    form.proxy_type.value = proxy.proxy_type || 'socks5';
    form.proxy_host.value = proxy.proxy_host || '';
    form.proxy_port.value = proxy.proxy_port || '';
    form.proxy_user.value = proxy.proxy_user || '';
    form.proxy_password.value = '';  // 密码不传回，留空表示不改
    form.remark.value = proxy.remark || '';
    form.operator.value = proxy.operator || '';
    document.getElementById('proxy-modal').style.display = 'flex';
}

function closeFormModal() {
    document.getElementById('proxy-modal').style.display = 'none';
}

// ===== 加载代理列表 =====
async function loadProxies() {
    const resp = await fetch('/api/config/proxy');
    const data = await resp.json();
    const tbody = document.querySelector('#proxy-table tbody');
    document.getElementById('proxy-count').textContent = data.data ? `(${data.data.length} 个)` : '';

    if (data.code === 0 && data.data.length > 0) {
        tbody.innerHTML = data.data.map(p => `
            <tr>
                <td>${p.id}</td>
                <td><strong>${escapeHtml(p.name) || '-'}</strong></td>
                <td>${escapeHtml(p.proxy_soft)}</td>
                <td><code>${escapeHtml(p.proxy_type)}</code></td>
                <td>${escapeHtml(p.proxy_host)}:${escapeHtml(p.proxy_port)}</td>
                <td>${escapeHtml(p.proxy_user) || '-'}</td>
                <td>
                    <span class="badge ${p.enabled ? 'badge-success' : 'badge-error'}">
                        ${p.enabled ? '🟢 启用' : '🔴 禁用'}
                    </span>
                </td>
                <td>${escapeHtml(p.remark) || '-'}</td>
                <td>${escapeHtml(p.operator) || '-'}</td>
                <td><small>${formatTime(p.created_at)}</small></td>
                <td style="white-space:nowrap;">
                    <button class="btn btn-sm btn-secondary" onclick='editProxy(${JSON.stringify(p).replace(/'/g, "&#39;")})'>✏️</button>
                    <button class="btn btn-sm ${p.enabled ? 'btn-warning' : 'btn-primary'}" onclick="toggleProxy(${p.id}, ${p.enabled ? 0 : 1})">${p.enabled ? '禁用' : '启用'}</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteProxy(${p.id}, '${escapeHtml(p.name || p.proxy_host + ':' + p.proxy_port)}')">🗑️</button>
                </td>
            </tr>
        `).join('');
    } else {
        tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted">暂无代理配置，点击「添加代理」开始</td></tr>';
    }
}

// 解决 JSON.stringify 在 onclick 中的特殊字符问题 — 用 data 属性传值
function editProxy(proxy) {
    openEditModal(proxy);
}

// ===== 提交表单（添加/编辑） =====
async function submitProxyForm(e) {
    e.preventDefault();
    const form = document.getElementById('proxy-form');
    const fd = new FormData(form);
    const body = Object.fromEntries(fd.entries());
    const id = body.id;

    // 构建请求体
    const payload = {
        name: body.name,
        proxy_soft: body.proxy_soft,
        proxy_type: body.proxy_type,
        proxy_host: body.proxy_host,
        proxy_port: body.proxy_port,
        proxy_user: body.proxy_user,
        proxy_password: body.proxy_password,
        remark: body.remark,
        operator: body.operator,
        enabled: 1,
    };

    let resp;
    if (id) {
        // 编辑：PUT
        resp = await fetch('/api/config/proxy/' + id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
    } else {
        // 新建：POST
        resp = await fetch('/api/config/proxy', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
    }

    const data = await resp.json();
    showToast(data.msg, data.code === 0 ? 'success' : 'error');
    if (data.code === 0) {
        closeFormModal();
        loadProxies();
    }
}

// ===== 启用/禁用 =====
async function toggleProxy(id, enabled) {
    await fetch('/api/config/proxy/' + id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled: enabled})
    });
    showToast(enabled ? '已启用' : '已禁用', 'success');
    loadProxies();
}

// ===== 删除 =====
async function deleteProxy(id, label) {
    if (!confirm(`确定删除代理「${label}」？此操作不可撤销。`)) return;
    await fetch('/api/config/proxy/' + id, {method: 'DELETE'});
    showToast('代理已删除', 'success');
    loadProxies();
}

// 初始化
document.addEventListener('DOMContentLoaded', loadProxies);
</script>
{% endblock %}
