{% extends "base.html" %}
{% block title %}总览 - Ads Manager{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📊 总览</h1>
    <p class="text-muted">系统概览和快捷操作</p>
</div>

<!-- 状态卡片 -->
<div class="stat-cards" id="stat-cards">
    <div class="stat-card">
        <div class="stat-icon">🔌</div>
        <div class="stat-info">
            <div class="stat-value" id="stat-api">--</div>
            <div class="stat-label">API 状态</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">🌐</div>
        <div class="stat-info">
            <div class="stat-value" id="stat-envs">--</div>
            <div class="stat-label">环境总数</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">▶️</div>
        <div class="stat-info">
            <div class="stat-value" id="stat-active">--</div>
            <div class="stat-label">已启动</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">📋</div>
        <div class="stat-info">
            <div class="stat-value" id="stat-tasks">--</div>
            <div class="stat-label">待处理任务</div>
        </div>
    </div>
</div>

<!-- 操作按钮 -->
<div class="action-bar">
    <div class="action-bar-left">
        <button class="btn btn-primary" onclick="runCheck()">🔍 初始化</button>
        <button class="btn btn-secondary" onclick="refreshDashboard()">🔄 刷新</button>
        <button class="btn btn-warning" onclick="processTasks()">⚡ 处理任务队列</button>
    </div>
</div>

<!-- 检查结果 -->
<div class="card" id="check-result" style="display:none;">
    <h3>检查结果</h3>
    <div id="check-content"></div>
</div>

<!-- 已启动环境 -->
<div class="card">
    <h3>▶️ 已启动环境</h3>
    <div id="active-profiles-list">
        <p class="text-muted">加载中...</p>
    </div>
</div>

<!-- 最近日志 -->
<div class="card">
    <h3>📋 最近操作日志</h3>
    <table class="data-table" id="recent-logs-table">
        <thead>
            <tr>
                <th>时间</th>
                <th>级别</th>
                <th>模块</th>
                <th>消息</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="4" class="text-center text-muted">加载中...</td></tr>
        </tbody>
    </table>
</div>

{% endblock %}

{% block extra_js %}
<script>
// ===== 仪表盘脚本 =====

// 页面加载时从缓存加载（避免每次打开都请求 AdsPower）
document.addEventListener('DOMContentLoaded', loadFromCache);

// 从缓存加载仪表盘数据
async function loadFromCache() {
    try {
        var cacheResp = await fetch('/api/env/cache/data');
        var cacheData = await cacheResp.json();
        if (cacheData.code === 0) {
            var envs = cacheData.data.profiles || [];
            var actives = cacheData.data.active_profiles || [];
            document.getElementById('stat-envs').textContent = envs.length + (envs.length > 0 ? '' : '');
            document.getElementById('stat-active').textContent = actives.length;
            renderActiveProfiles(actives);
        }
    } catch(e) { /* ignore - stat stays as "--" */ }
    // 状态信息从 /api/status 获取（轻量请求）
    try {
        var statusResp = await fetch('/api/status');
        var statusData = await statusResp.json();
        if (statusData.code === 0) {
            var s = statusData.data;
            var apiText = '', apiColor = '';
            if (!s.api_key_ok) { apiText = '⚠️ 未配置'; apiColor = '#f97316'; }
            else if (s.adspower_ok) { apiText = '✅ 正常'; apiColor = '#4ade80'; }
            else { apiText = '❌ 异常'; apiColor = '#f87171'; }
            document.getElementById('stat-api').textContent = apiText;
            document.getElementById('stat-api').style.color = apiColor;
        }
    } catch(e) { /* ignore */ }
    // 任务数量
    try {
        var tasksResp = await fetch('/api/env/tasks?status=pending');
        var tasksData = await tasksResp.json();
        document.getElementById('stat-tasks').textContent = tasksData.data?.length || 0;
    } catch(e) { /* ignore */ }
    // 最近日志
    try {
        var logsResp = await fetch('/api/logs/operation?limit=10');
        var logsData = await logsResp.json();
        var tbody = document.querySelector('#recent-logs-table tbody');
        if (logsData.code === 0 && logsData.data && logsData.data.list) {
            tbody.innerHTML = logsData.data.list.map(function(l) {
                return '<tr>' +
                    '<td>' + formatTime(l.created_at) + '</td>' +
                    '<td><span class="badge badge-' + (l.level || '').toLowerCase() + '">' + (l.level || '') + '</span></td>' +
                    '<td>' + (l.module || '') + '</td>' +
                    '<td>' + escapeHtml(l.message) + '</td>' +
                '</tr>';
            }).join('') || '<tr><td colspan="4" class="text-center text-muted">暂无日志</td></tr>';
        }
    } catch(e) { /* ignore */ }
}

// 刷新仪表盘（从 AdsPower 重新获取，用于"刷新"按钮）
async function refreshDashboard() {
    showToast('正在刷新数据...', 'info');
    // 先刷新缓存
    try {
        await fetch('/api/env/cache/refresh', {method: 'POST'});
    } catch(e) { /* ignore */ }
    // 重新加载所有数据
    await loadFromCache();
    showToast('已刷新', 'success');
}

// 已启动环境渲染
function renderActiveProfiles(actives) {
    var container = document.getElementById('active-profiles-list');
    if (!actives || actives.length === 0) {
        container.innerHTML = '<p class="text-muted">暂无已启动环境</p>';
    } else {
        container.innerHTML = actives.map(function(a) {
            return '<div class="env-tag">' + escapeHtml(a.user_id || a.profile_id) + ' ' + escapeHtml(a.name || '') + '</div>';
        }).join('');
    }
}

// 执行初始化检查
async function runCheck() {
    showToast('正在执行初始化检查...', 'info');
    try {
        const resp = await fetch('/api/env/check');
        const data = await resp.json();
        if (data.code === 0) {
            const d = data.data;
            let html = `
                <p><strong>API 连接:</strong> ${d.api_ok ? '✅ AdsPower 已连接' : '❌ AdsPower 未连接'}</p>
                <p><strong>环境总数:</strong> ${d.total_profiles}</p>
                <p><strong>保留环境:</strong> ${d.preserved_count}</p>
                <p><strong>缺失保留:</strong> ${d.missing_preserved.length} (配置中有但实际不存在)</p>
                <p><strong>可清理:</strong> ${d.unpreserved_profiles.length} (实际存在但未保留)</p>
                <p><strong>已启动:</strong> ${d.active_profiles.length}</p>
            `;
            if (d.missing_preserved.length > 0) {
                html += '<p><strong>⚠️ 缺失的保留环境:</strong></p><ul>';
                d.missing_preserved.forEach(m => html += `<li>${m.env_name} (${m.profile_id})</li>`);
                html += '</ul>';
            }
            document.getElementById('check-content').innerHTML = html;
            document.getElementById('check-result').style.display = 'block';
            showToast('检查完成', 'success');
        } else {
            showToast('检查失败: ' + data.msg, 'error');
        }
        // 检查后刷新缓存
        try { await fetch('/api/env/cache/refresh', {method: 'POST'}); } catch(e) {}
        refreshDashboard();
    } catch(e) {
        showToast('检查异常: ' + e.message, 'error');
    }
}

// 处理任务队列
async function processTasks() {
    showToast('正在处理任务队列...', 'info');
    try {
        const resp = await fetch('/api/env/tasks/process', {method: 'POST'});
        const data = await resp.json();
        showToast(data.msg, data.code === 0 ? 'success' : 'error');
        refreshDashboard();
    } catch(e) {
        showToast('处理失败: ' + e.message, 'error');
    }
}
</script>
{% endblock %}
