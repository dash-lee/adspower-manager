{% extends "base.html" %}
{% block title %}配置管理 - AdsPower Manager{% endblock %}

{% block content %}
<div class="page-header">
    <h1>⚙️ 配置管理</h1>
    <p class="text-muted">管理系统所有配置项（修改后即时生效）</p>
</div>

<!-- 选项卡 -->
<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('general')">通用配置</button>
    <button class="tab-btn" onclick="switchTab('proxy')">代理配置</button>
    <button class="tab-btn" onclick="switchTab('fingerprint')">指纹随机池</button>
    <button class="tab-btn" onclick="switchTab('preserved')">环境保留</button>
</div>

<!-- ===== 通用配置 ===== -->
<div class="tab-content active" id="tab-general">
    <div class="card">
        <h3>通用配置 <button class="btn btn-sm btn-primary" onclick="showAddGeneralForm()">+ 添加</button></h3>
        <table class="data-table" id="general-table">
            <thead>
                <tr><th>配置键</th><th>值</th><th>分类</th><th>备注</th><th>操作</th></tr>
            </thead>
            <tbody><tr><td colspan="5" class="text-center text-muted">加载中...</td></tr></tbody>
        </table>
    </div>
</div>

<!-- ===== 代理配置 ===== -->
<div class="tab-content" id="tab-proxy">
    <div class="card">
        <h3>代理配置 <button class="btn btn-sm btn-primary" onclick="showAddProxyForm()">+ 添加代理</button></h3>
        <table class="data-table" id="proxy-table">
            <thead>
                <tr><th>名称</th><th>类型</th><th>主机:端口</th><th>状态</th><th>备注</th><th>操作</th></tr>
            </thead>
            <tbody><tr><td colspan="6" class="text-center text-muted">加载中...</td></tr></tbody>
        </table>
    </div>
</div>

<!-- ===== 指纹随机池 ===== -->
<div class="tab-content" id="tab-fingerprint">
    <div class="card">
        <h3>指纹随机池 <button class="btn btn-sm btn-primary" onclick="showAddFingerprintForm()">+ 添加候选项</button>
            <button class="btn btn-sm btn-secondary" onclick="initDefaults()" style="margin-left:8px;">📦 初始化默认值</button>
        </h3>
        <table class="data-table" id="fingerprint-table">
            <thead>
                <tr><th>参数名</th><th>候选值</th><th>权重</th><th>状态</th><th>备注</th><th>操作</th></tr>
            </thead>
            <tbody><tr><td colspan="6" class="text-center text-muted">加载中...</td></tr></tbody>
        </table>
    </div>
</div>

<!-- ===== 环境保留 ===== -->
<div class="tab-content" id="tab-preserved">
    <div class="card">
        <h3>环境保留 <button class="btn btn-sm btn-primary" onclick="showAddPreservedForm()">+ 添加保留环境</button></h3>
        <table class="data-table" id="preserved-table">
            <thead>
                <tr><th>环境ID</th><th>名称</th><th>备注</th><th>操作</th></tr>
            </thead>
            <tbody><tr><td colspan="4" class="text-center text-muted">加载中...</td></tr></tbody>
        </table>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let currentTab = 'general';

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
    loadTabData(tab);
}

function loadTabData(tab) {
    if (tab === 'general') loadGeneralConfig();
    else if (tab === 'proxy') loadProxyConfig();
    else if (tab === 'fingerprint') loadFingerprintConfig();
    else if (tab === 'preserved') loadPreservedConfig();
}

// ===== 通用配置 =====
async function loadGeneralConfig() {
    const resp = await fetch('/api/config/general');
    const data = await resp.json();
    const tbody = document.querySelector('#general-table tbody');
    if (data.code === 0) {
        tbody.innerHTML = data.data.map(c => `
            <tr>
                <td><code>${c.config_key}</code></td>
                <td><input type="text" value="${escapeHtml(c.config_value)}" data-key="${c.config_key}" class="inline-input" onchange="updateGeneral('${c.config_key}', this.value)"></td>
                <td>${c.category}</td>
                <td>${c.remark}</td>
                <td><button class="btn btn-sm btn-danger" onclick="deleteGeneral(${c.id})">删除</button></td>
            </tr>
        `).join('');
    }
}

async function updateGeneral(key, value) {
    await fetch('/api/config/general', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({config_key: key, config_value: value})
    });
    showToast('配置已更新（即时生效）', 'success');
}

async function deleteGeneral(id) {
    if (!confirm('确定删除此配置?')) return;
    await fetch('/api/config/general/' + id, {method: 'DELETE'});
    showToast('配置已删除', 'success');
    loadGeneralConfig();
}

async function showAddGeneralForm() {
    const key = prompt('配置键名 (如 my_config_key):');
    if (!key) return;
    const value = prompt('配置值:');
    if (value === null) return;
    const remark = prompt('备注（可选）:') || '';
    await fetch('/api/config/general', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({config_key: key, config_value: value, remark: remark})
    });
    showToast('配置已添加', 'success');
    loadGeneralConfig();
}

// ===== 代理配置 =====
async function loadProxyConfig() {
    const resp = await fetch('/api/config/proxy');
    const data = await resp.json();
    const tbody = document.querySelector('#proxy-table tbody');
    if (data.code === 0) {
        tbody.innerHTML = data.data.map(p => `
            <tr>
                <td>${p.name || '-'}</td>
                <td>${p.proxy_soft} / ${p.proxy_type}</td>
                <td>${p.proxy_host}:${p.proxy_port}</td>
                <td><span class="badge ${p.enabled ? 'badge-success' : 'badge-error'}">${p.enabled ? '启用' : '禁用'}</span></td>
                <td>${p.remark || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-danger" onclick="deleteProxy(${p.id})">删除</button>
                </td>
            </tr>
        `).join('') || '<tr><td colspan="6" class="text-center text-muted">暂无代理配置</td></tr>';
    }
}

async function showAddProxyForm() {
    const host = prompt('代理主机 (如 1.2.3.4):');
    if (!host) return;
    const port = prompt('代理端口 (如 1080):');
    if (!port) return;
    const type = prompt('代理类型 (http/https/socks5):', 'socks5') || 'socks5';
    const name = prompt('名称（可选）:') || '';
    const user = prompt('用户名（可选）:') || '';
    const pass = prompt('密码（可选）:') || '';
    await fetch('/api/config/proxy', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({proxy_host: host, proxy_port: port, proxy_type: type, name: name, proxy_user: user, proxy_password: pass})
    });
    showToast('代理已添加', 'success');
    loadProxyConfig();
}

async function deleteProxy(id) {
    if (!confirm('确定删除?')) return;
    await fetch('/api/config/proxy/' + id, {method: 'DELETE'});
    showToast('已删除', 'success');
    loadProxyConfig();
}

// ===== 指纹随机池 =====
async function loadFingerprintConfig() {
    const resp = await fetch('/api/config/fingerprint');
    const data = await resp.json();
    const tbody = document.querySelector('#fingerprint-table tbody');
    if (data.code === 0) {
        tbody.innerHTML = data.data.map(f => `
            <tr>
                <td><code>${f.param_name}</code></td>
                <td><small>${escapeHtml(f.param_value)}</small></td>
                <td>${f.weight}</td>
                <td><span class="badge ${f.enabled ? 'badge-success' : 'badge-muted'}">${f.enabled ? '启用' : '禁用'}</span></td>
                <td>${f.remark || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-secondary" onclick="toggleFingerprint(${f.id}, ${f.enabled ? 0 : 1})">${f.enabled ? '禁用' : '启用'}</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteFingerprint(${f.id})">删除</button>
                </td>
            </tr>
        `).join('') || '<tr><td colspan="6" class="text-center text-muted">暂无候选项（点击"初始化默认值"添加）</td></tr>';
    }
}

async function showAddFingerprintForm() {
    const param = prompt('参数名 (screen_resolution/fonts/hardware_concurrency/device_memory/media_devices):');
    if (!param) return;
    const value = prompt('候选值:');
    if (!value) return;
    const weight = parseInt(prompt('权重 (1-10):', '1')) || 1;
    await fetch('/api/config/fingerprint', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({param_name: param, param_value: value, weight: weight})
    });
    showToast('候选项已添加', 'success');
    loadFingerprintConfig();
}

async function toggleFingerprint(id, enabled) {
    await fetch('/api/config/fingerprint/' + id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled: enabled})
    });
    loadFingerprintConfig();
}

async function deleteFingerprint(id) {
    if (!confirm('确定删除?')) return;
    await fetch('/api/config/fingerprint/' + id, {method: 'DELETE'});
    showToast('已删除', 'success');
    loadFingerprintConfig();
}

async function initDefaults() {
    if (!confirm('初始化默认配置（不会覆盖已有配置）?')) return;
    showToast('正在初始化...', 'info');
    const resp = await fetch('/api/config/init_defaults', {method: 'POST'});
    const data = await resp.json();
    showToast(data.msg, 'success');
    loadFingerprintConfig();
    loadGeneralConfig();
}

// ===== 环境保留 =====
async function loadPreservedConfig() {
    const resp = await fetch('/api/config/preserved');
    const data = await resp.json();
    const tbody = document.querySelector('#preserved-table tbody');
    if (data.code === 0) {
        tbody.innerHTML = data.data.map(e => `
            <tr>
                <td><code>${e.profile_id}</code></td>
                <td>${e.env_name || '-'}</td>
                <td>${e.remark || '-'}</td>
                <td><button class="btn btn-sm btn-danger" onclick="deletePreserved(${e.id})">移除</button></td>
            </tr>
        `).join('') || '<tr><td colspan="4" class="text-center text-muted">暂无保留环境</td></tr>';
    }
}

async function showAddPreservedForm() {
    const pid = prompt('环境 profile_id:');
    if (!pid) return;
    const name = prompt('环境名称（可选）:') || '';
    const resp = await fetch('/api/config/preserved', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({profile_id: pid, env_name: name})
    });
    const data = await resp.json();
    showToast(data.msg, data.code === 0 ? 'success' : 'error');
    loadPreservedConfig();
}

async function deletePreserved(id) {
    if (!confirm('确定移除保留?')) return;
    await fetch('/api/config/preserved/' + id, {method: 'DELETE'});
    showToast('已移除', 'success');
    loadPreservedConfig();
}

// 初始化加载
document.addEventListener('DOMContentLoaded', () => loadTabData('general'));
</script>
{% endblock %}
