{% extends "base.html" %}
{% block title %}环境管理 - Ads Manager{% endblock %}

{% block content %}
<div class="page-header">
    <h1>🌐 环境管理</h1>
    <p class="text-muted">管理 AdsPower 浏览器环境</p>
</div>

<!-- 操作按钮 -->
<div class="action-bar">
    <button class="btn btn-primary" onclick="showCreateForm()">➕ 创建环境</button>
    <button class="btn btn-danger" onclick="showBatchDeleteForm()">🗑️ 批量删除</button>
    <button class="btn btn-secondary" onclick="loadEnvironments()">🔄 刷新列表</button>
</div>

<!-- 环境列表 -->
<div class="card">
    <h3>环境列表 <span id="env-count" class="text-muted" style="font-weight:normal;font-size:14px;"></span></h3>
    <div style="overflow-x:auto;">
        <table class="data-table" id="env-table">
            <thead>
                <tr>
                    <th><input type="checkbox" id="select-all" onchange="toggleSelectAll(this)"></th>
                    <th>编号</th>
                    <th>名称</th>
                    <th>分组</th>
                    <th>代理</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="7" class="text-center text-muted">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 创建环境表单（模态框） -->
<div class="modal" id="create-modal" style="display:none;">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal('create-modal')">&times;</span>
        <h2>创建新环境</h2>
        <form id="create-form" onsubmit="createEnvironment(event)">
            <div class="form-group">
                <label>环境名称</label>
                <input type="text" id="create-name" placeholder="自动生成...">
            </div>
            <div class="form-group">
                <label>分组ID</label>
                <input type="text" id="create-group" value="0" placeholder="0=默认分组">
            </div>
            <div class="form-group">
                <label>创建数量</label>
                <input type="number" id="create-count" value="1" min="1" max="100">
            </div>
            <div class="form-group">
                <label>初始URL（可选）</label>
                <input type="text" id="create-url" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>代理ID（可选，留空则随机选择）</label>
                <input type="text" id="create-proxy" placeholder="留空自动选择">
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="create-queue"> 加入任务队列
                </label>
            </div>
            <button type="submit" class="btn btn-primary">创建</button>
            <button type="button" class="btn btn-secondary" onclick="closeModal('create-modal')">取消</button>
        </form>
    </div>
</div>

<!-- 批量删除模态框 -->
<div class="modal" id="delete-modal" style="display:none;">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal('delete-modal')">&times;</span>
        <h2>批量删除环境</h2>
        <p>已选中 <strong id="delete-count">0</strong> 个环境</p>
        <div class="form-group">
            <label>
                <input type="checkbox" id="delete-force"> 强制删除（包括保留环境）
            </label>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" id="delete-queue"> 加入任务队列
            </label>
        </div>
        <button class="btn btn-danger" onclick="batchDelete()">确认删除</button>
        <button class="btn btn-secondary" onclick="closeModal('delete-modal')">取消</button>
    </div>
</div>

<!-- 环境详情模态框 -->
<div class="modal" id="detail-modal" style="display:none;">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal('detail-modal')">&times;</span>
        <h2>环境详情</h2>
        <div id="detail-content"></div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let selectedIds = new Set();
let allEnvironments = [];

// 加载环境列表
async function loadEnvironments() {
    try {
        const resp = await fetch('/api/env/list/all');
        const data = await resp.json();
        if (data.code === 0) {
            allEnvironments = data.data.list || [];
            document.getElementById('env-count').textContent = `(共 ${allEnvironments.length} 个)`;
            renderTable();
        }
    } catch(e) {
        showToast('加载失败: ' + e.message, 'error');
    }
}

function renderTable() {
    const tbody = document.querySelector('#env-table tbody');
    tbody.innerHTML = allEnvironments.map(env => `
        <tr>
            <td><input type="checkbox" value="${env.profile_id}" onchange="toggleSelect('${env.profile_id}', this)" ${selectedIds.has(env.profile_id) ? 'checked' : ''}></td>
            <td>${env.serial_number || '-'}</td>
            <td>${escapeHtml(env.name || '') || '-'}</td>
            <td>${env.group_name || env.group_id || '-'}</td>
            <td>${env.ip || '-'}</td>
            <td id="status-${env.profile_id}">--</td>
            <td>
                <button class="btn btn-sm btn-secondary" onclick="viewDetail('${env.profile_id}')">详情</button>
                <button class="btn btn-sm btn-primary" onclick="startBrowser('${env.profile_id}')">启动</button>
                <button class="btn btn-sm btn-warning" onclick="stopBrowser('${env.profile_id}')">关闭</button>
            </td>
        </tr>
    `).join('') || '<tr><td colspan="7" class="text-center text-muted">暂无环境</td></tr>';
}

// 选择逻辑
function toggleSelectAll(el) {
    selectedIds.clear();
    if (el.checked) {
        allEnvironments.forEach(e => selectedIds.add(e.profile_id));
    }
    renderTable();
}

function toggleSelect(id, el) {
    if (el.checked) selectedIds.add(id);
    else selectedIds.delete(id);
}

// 创建环境
function showCreateForm() { document.getElementById('create-modal').style.display = 'flex'; }

async function createEnvironment(e) {
    e.preventDefault();
    const count = parseInt(document.getElementById('create-count').value) || 1;
    const body = {
        count: count,
        env_name: document.getElementById('create-name').value,
        group_id: document.getElementById('create-group').value,
        proxy_id: document.getElementById('create-proxy').value || null,
        open_url: document.getElementById('create-url').value || null,
        use_queue: document.getElementById('create-queue').checked,
    };
    const resp = await fetch('/api/env/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
    });
    const data = await resp.json();
    closeModal('create-modal');
    showToast(data.msg, data.code === 0 ? 'success' : 'error');
    loadEnvironments();
}

// 批量删除
function showBatchDeleteForm() {
    document.getElementById('delete-count').textContent = selectedIds.size;
    document.getElementById('delete-modal').style.display = 'flex';
}

async function batchDelete() {
    const resp = await fetch('/api/env/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            profile_ids: Array.from(selectedIds),
            force: document.getElementById('delete-force').checked,
            use_queue: document.getElementById('delete-queue').checked,
        }),
    });
    const data = await resp.json();
    closeModal('delete-modal');
    selectedIds.clear();
    showToast(data.msg, data.code === 0 ? 'success' : 'error');
    loadEnvironments();
}

// 浏览器控制
async function startBrowser(id) {
    showToast('正在启动...', 'info');
    const resp = await fetch('/api/env/browser/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({profile_id: id}),
    });
    const data = await resp.json();
    showToast(data.msg || '已启动', data.code === 0 ? 'success' : 'error');
}

async function stopBrowser(id) {
    showToast('正在关闭...', 'info');
    const resp = await fetch('/api/env/browser/stop', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({profile_id: id}),
    });
    const data = await resp.json();
    showToast(data.msg || '已关闭', data.code === 0 ? 'success' : 'error');
}

// 详情
async function viewDetail(id) {
    const env = allEnvironments.find(e => e.profile_id === id);
    if (!env) return;
    document.getElementById('detail-content').innerHTML = `
        <table class="data-table">
            ${Object.entries(env).map(([k,v]) => `<tr><td><strong>${k}</strong></td><td>${typeof v === 'object' ? JSON.stringify(v) : (v || '-')}</td></tr>`).join('')}
        </table>
    `;
    document.getElementById('detail-modal').style.display = 'flex';
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }

document.addEventListener('DOMContentLoaded', loadEnvironments);
</script>
{% endblock %}
